    <circle cx="28" cy="28" r="8" fill="#0F172A"/>
    <circle cx="68" cy="28" r="8" fill="#0F172A"/>
    <circle cx="48" cy="48" r="8" fill="#0F172A"/>
    <circle cx="28" cy="68" r="8" fill="#0F172A"/>
